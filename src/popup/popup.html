<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meeting Cost Ticker</title>
  <link rel="stylesheet" href="popup.css" />
</html>
<body>
  <main class="container">
    <h1>Meeting Cost Ticker</h1>
    <p class="subtitle">Default settings for the meeting overlay.</p>

    <form id="settings-form">
      <label for="attendees">Attendees</label>
      <input type="number" id="attendees" min="1" max="500" required />

      <label for="hourly-rate">Average hourly rate</label>
      <input type="number" id="hourly-rate" min="0" step="0.5" required />

      <label for="currency">Currency</label>
      <select id="currency">
        <option value="USD">USD $</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
        <option value="MXN">MXN $</option>
        <option value="COP">COP $</option>
        <option value="ARS">ARS $</option>
        <option value="BRL">BRL R$</option>
        <option value="PEN">PEN S/</option>
      </select>

      <button type="submit" id="save">Save</button>
    </form>

    <p id="status" role="status"></p>

    <footer>
      <p>The ticker starts automatically on Google Meet, Zoom and Teams. Drag the big number to move it.</p>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
